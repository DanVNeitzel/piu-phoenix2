      let timer;
      function reset(){
        clearTimeout(timer);toast.hidden=false;recall.hidden=true;primary.dataset.done='false';
        heading.textContent='Nova versão disponível';
        description.textContent='Atualize o jogo para receber as últimas melhorias e correções.';
        primary.textContent='Atualizar agora';primary.disabled=false;later.hidden=false;
      }
      root.querySelectorAll('[data-screen]').forEach(button=>button.addEventListener('click',()=>{
        root.querySelectorAll('[data-screen]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
        scene.style.backgroundImage='url("'+images[button.dataset.screen]+'")';reset();
      }));
      later.addEventListener('click',()=>{toast.hidden=true;recall.hidden=false;});
      recall.addEventListener('click',reset);
      primary.addEventListener('click',()=>{
        if(primary.dataset.done==='true'){primary.dataset.done='false';reset();return;}
        primary.disabled=true;later.hidden=true;primary.textContent='Atualizando…';
        heading.textContent='Atualizando o jogo';description.textContent='Baixando os arquivos da nova versão…';
        timer=setTimeout(()=>{
          heading.textContent='Tudo pronto para jogar';
          description.textContent='Prévia concluída. No jogo, você voltará à tela inicial com a nova versão.';
          primary.textContent='Ver aviso novamente';primary.disabled=false;primary.dataset.done='true';
        },1400);
      });
      if(globalThis.Tweak){
        const state={accent:'#b6ef51',radius:12};
        const tweak=new Tweak({container:toast,onChange:()=>{
          root.style.setProperty('--toast-accent',state.accent);toast.style.borderRadius=state.radius+'px';
        }});
        tweak.addColorPicker(state,'accent',{label:'Cor de destaque'});
        tweak.addSlider(state,'radius',{label:'Cantos',min:0,max:20,unit:'px'});
