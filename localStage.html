  <dialog id="game-abandon-confirm" aria-labelledby="game-abandon-title" aria-describedby="game-abandon-description">
    <h1 id="game-abandon-title">Abandonar música?</h1>
    <p id="game-abandon-description">Esta partida não salvará pontuação, recorde ou histórico. Você voltará à seleção de músicas.</p>
    <div class="pause-actions"><button type="button" id="game-abandon-cancel" autofocus>Cancelar</button><button type="button" id="game-abandon-confirm-button">Sim, abandonar</button></div>
  </dialog>
  <script src="Demo/LocalStage/RunLocalStage.js?v=0.8.56"></script>
  <script>

    var playNoteSkin = document.getElementById("playNoteSkin");
    var playSpeed = document.getElementById("playSpeed");
    var playDisplay = document.getElementById("playDisplay");
    var playRush = document.getElementById("playRush");
    var playCount = document.getElementById("playCount");

    playCurrentStats();

    function playCurrentStats() {
      let imgPath = 'assets/img/noteskin/';
      let noteskin = config?.noteskin || localStorage.getItem("last_noteskin") || 'PHOENIX2';
      let speed = config?.speed || localStorage.getItem("last_speed");
      let bga = config?.bga || localStorage.getItem("last_bga");
      let rush = String(config?.playback ?? localStorage.getItem("last_playback"));
      playDisplay.hidden = !['off','dark'].includes(bga);
      playRush.hidden = !Number.isFinite(Number(rush)) || Number(rush) === 1 || Number(rush) <= 0;
      let count = localStorage.getItem("last_playCount");
      playNoteSkin.src = noteskin.startsWith('PUMP-')
        ? 'assets/img/CW_settings/noteskin_cover/' + noteskin + '.png'
        : imgPath + noteskin + '/thumbnail.gif';
      playSpeed.textContent = config?.scrollMode === 'auto' ? 'AV ' + config.autoVelocity : speed + 'X';
      count = Number(count) + 1;
      console.log(count);
      if (count === null) {
        playCount.innerHTML = '---';
      } else {
        const n = parseInt(count, 10);
        playCount.innerHTML = isNaN(n) ? count : (n < 10 ? '0' + n : n);
      }

      switch (bga) {
        case 'on':
          playDisplay.innerHTML = 'BGA ON';
          break;

        case 'off':
          playDisplay.innerHTML = 'BGA OFF';
          break;

        case 'dark':
          playDisplay.innerHTML = 'BGA DARK';
          break;

        default:
          playDisplay.innerHTML = '---';
          break;
      }

      switch (rush) {
        case '0.8':
          playRush.innerHTML = 'RUSH<br>80%';
          break;

        case '0.9':
          playRush.innerHTML = 'RUSH<br>90%';
          break;

        case '1':
          playRush.innerHTML = 'RUSH<br>100%';
          break;

        case '1.1':
          playRush.innerHTML = 'RUSH<br>110%';
          break;

        case '1.2':
          playRush.innerHTML = 'RUSH<br>120%';
          break;

        case '1.3':
          playRush.innerHTML = 'RUSH<br>130%';
          break;

        case '1.4':
          playRush.innerHTML = 'RUSH<br>140%';
          break;

        case '1.5':
          playRush.innerHTML = 'RUSH<br>150%';
          break;

        default:
          playDisplay.innerHTML = '---';
          break;
      }
    }

    function verifyFullscreen() {
      if (touchPreview) return;
      if (localStorage.getItem("fullscreen") === "false") {
        if (document.cancelFullScreen) {
          document.cancelFullScreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.webkitCancelFullScreen) {
          document.webkitCancelFullScreen();
        }
      } else {
        if (localStorage.getItem("fullscreen") === "true" || localStorage.getItem("fullscreen") === null) {
          if ((document.fullScreenElement && document.fullScreenElement !== null) || (!document.mozFullScreen && !document.webkitIsFullScreen)) {
            if (document.documentElement.requestFullScreen) {
              document.documentElement.requestFullScreen();
            } else if (document.documentElement.mozRequestFullScreen) {
              document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullScreen) {
              document.documentElement.webkitRequestFullScreen(Element.ALLOW_KEYBOARD_INPUT);
            }
          }
        }
      }
    }

  </script>
